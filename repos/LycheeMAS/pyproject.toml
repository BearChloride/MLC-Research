[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lychee-mas"
version = "0.1.0"
description = "LycheeMAS — 运行时可插拔的多智能体系统研究框架（统一图抽象 G=(V,E,W,T,M)）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LycheeMAS" }]
# 核心骨架零运行依赖（黄金法则 4）：纯标准库即可 import 并跑通离线 mock 示例。
dependencies = []

[project.optional-dependencies]
# 运行时后端 + latent 注入（autogen / torch / transformers）。仅 runtime/backends/autogen_*.py 与
# hf_backend / 真实推理才需要；离线 mock 不需要。
runtime = [
    "autogen-agentchat>=0.7,<0.8",
    "autogen-core>=0.7,<0.8",
    "autogen-ext[openai]>=0.7,<0.8",
    "torch",
    "transformers",
]
# LangGraph 执行后端（runtime/langgraph）。仅 runtime/backends/langgraph_runtime.py 需要。
langgraph = ["langgraph>=1.0,<2"]
numeric = ["numpy"]
config = ["pyyaml", "hydra-core"]
# L1 construct / AgentInit 选择器：多目标 Pareto 选择（官方同款 vendi_score，不自实现）。
construct = ["numpy", "vendi_score"]
dev = ["pytest", "ruff", "mypy"]
# 文档站（MkDocs Material + mkdocstrings，griffe 静态解析源码，纯 Python 无 CUDA 冲突）。
# 构建文档不 import lychee_mas，故不需要 torch/autogen；`make docs` 本地预览。
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-include-markdown-plugin>=6.0",
]
# benchmark：数据下载/准备 + 数学打分 + HumanEval/GAIA 工具链 + 分析脚本（重依赖，仅真实跑分需要）。
benchmark = [
    "datasets",
    "huggingface_hub",
    "modelscope",
    "pandas",
    "pyarrow",
    "regex",
    "sympy",
    "latex2sympy2-extended",
    "word2number",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "beautifulsoup4",
    "lxml",
    "numpy",
    "openpyxl",
    "xlrd",
    "pdfplumber",
    "pypdf",
    "pillow",
    "pydub",
    "python-docx",
    "requests",
    "playwright",
    "imageio-ffmpeg",
]
# 全量：上面所有 + 数据/数学评分依赖（datasets / sympy 等供 eval 真实跑分）
all = [
    "autogen-agentchat>=0.7,<0.8",
    "autogen-core>=0.7,<0.8",
    "autogen-ext[openai]>=0.7,<0.8",
    "langgraph>=1.0,<2",
    "torch",
    "transformers",
    "numpy",
    "vendi_score",
    "tenacity",
    "pyyaml",
    "hydra-core",
    "datasets",
    "huggingface_hub",
    "modelscope",
    "pandas",
    "pyarrow",
    "sympy",
    "regex",
    "latex2sympy2-extended",
    "word2number",
    "accelerate",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "beautifulsoup4",
    "lxml",
    "openpyxl",
    "xlrd",
    "pdfplumber",
    "pypdf",
    "pillow",
    "pydub",
    "python-docx",
    "requests",
    "playwright",
    "imageio-ffmpeg",
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lychee_mas*"]

[tool.ruff]
line-length = 100
src = ["src/lychee_mas"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# math_parsing_util.py 是 Qwen2.5-Math 的逐字借用，保留原样不强制风格。
[tool.ruff.lint.per-file-ignores]
"src/lychee_mas/eval/math_parsing_util.py" = ["E", "F", "W", "I"]
# _generate.py 的 prompt 常量逐字移植自官方 AgentInit（保留原措辞，不折行）；只豁免行长。
"src/lychee_mas/methods/build/selectors/_generate.py" = ["E501"]
# maspo/prompts.py 的提示常量逐字移植自 MASPO（保留原措辞，不折行）；只豁免行长。
"src/lychee_mas/methods/prerun/maspo/prompts.py" = ["E501"]
# aggagent prompts/tools 逐字移植自 princeton-pli/AggAgent（保留原措辞，不折行）；只豁免行长。
"src/lychee_mas/methods/processing/aggagent/prompts.py" = ["E501"]
"src/lychee_mas/methods/processing/aggagent/tools.py" = ["E501"]

[tool.pytest.ini_options]
# 只收集本框架测试，避免触碰 vendored src/autogen 的测试（它们需 autogen 才能 collect）。
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["src/autogen", "src/LycheeMAS"]
